            <p class="text-lg text-[var(--color-text-secondary)] mb-10 max-w-2xl" data-lang-key="phLead">Mountains, coasts and cities I have walked through. Shot on a phone, mostly at the wrong time of day, which is when the light is interesting.</p>

            <div class="photo-grid">
                <a class="ph-w3h2" href="images/photos/02_meili_sunrise.jpg" target="_blank"><img src="images/photos/02_meili_sunrise.jpg" alt=""><figcaption data-lang-key="ph2">First light on Meili Snow Mountain, Yunnan</figcaption></a>

                <a class="ph-w3h1" href="images/photos/04_valley_peak.jpg" target="_blank"><img src="images/photos/04_valley_peak.jpg" alt=""><figcaption data-lang-key="ph4">Valley and peak, Sichuan</figcaption></a>
                <a class="ph-w2h2" href="images/photos/05_seven_sisters.jpg" target="_blank"><img src="images/photos/05_seven_sisters.jpg" alt=""><figcaption data-lang-key="ph5">Seven Sisters and Belle Tout lighthouse, East Sussex</figcaption></a>
